<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微博 · 模拟社区</title>
  <style>
    :root {
      --bg: #fff4f0;
      --bg-2: #ffe8f0;
      --surface: #ffffff;
      --text: #3b2a32;
      --text-2: #7a5f6c;
      --text-3: #b08a9a;
      --line: #f0d4dc;
      --line-soft: #f7e6eb;
      --accent: #ff4d8d;
      --accent-hover: #f2377a;
      --accent-2: #ff7a45;
      --accent-soft: #ffe0ec;
      --danger: #ff4b4b;
      --like: #ff4d8d;
      --ok: #3ecf8e;
      --shadow: 0 4px 20px rgba(255, 77, 141, 0.08);
      --shadow-lg: 0 24px 60px rgba(255, 77, 141, 0.18);
      --radius: 20px;
      --radius-sm: 14px;
      --nav-h: 52px;
      --max: 1080px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(1200px 600px at 10% -10%, #ffe0f0 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #ffe8d6 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.47059;
      font-size: 17px;
      letter-spacing: -0.022em;
    }
    button, input, textarea { font: inherit; letter-spacing: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    img, video { max-width: 100%; display: block; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; }

    /* ——— Top nav ——— */
    .topnav {
      position: sticky; top: 0; z-index: 100;
      height: var(--nav-h);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255, 77, 141, 0.1);
      color: var(--text);
    }
    .topnav-inner {
      max-width: var(--max);
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 18px; letter-spacing: -0.021em;
      color: var(--text); flex-shrink: 0;
    }
    .brand-mark {
      width: 26px; height: 26px; border-radius: 9px;
      background: linear-gradient(135deg, #ff4d8d, #ff7a45);
      color: #fff;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      box-shadow: 0 4px 12px rgba(255, 77, 141, 0.35);
    }
    .search {
      flex: 1; max-width: 320px;
      display: flex; align-items: center;
      background: rgba(255, 77, 141, 0.06);
      border-radius: 980px;
      padding: 0 14px;
      height: 34px;
      border: 1px solid transparent;
      transition: border-color .2s, background .2s;
    }
    .search:focus-within {
      background: #fff;
      border-color: rgba(255, 77, 141, 0.35);
    }
    .search input {
      border: 0; outline: 0; width: 100%;
      background: transparent; color: var(--text); font-size: 14px;
    }
    .search input::placeholder { color: var(--text-3); }
    .nav-links { display: flex; gap: 2px; margin-left: auto; }
    .nav-links button {
      color: var(--text-2); padding: 6px 12px; border-radius: 980px;
      font-size: 13px; transition: color .2s, background .2s;
    }
    .nav-links button:hover { color: var(--accent); background: var(--accent-soft); }
    .nav-user {
      display: flex; align-items: center; gap: 10px;
      margin-left: 6px; padding-left: 14px;
      border-left: 1px solid var(--line-soft);
    }
    .nav-user .nav-nick {
      font-size: 12px; max-width: 88px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: var(--text-2);
    }
    .nav-user .btn-nav-text {
      font-size: 12px; color: var(--text-2); padding: 4px 2px;
    }
    .nav-user .btn-nav-text:hover { color: var(--accent); }
    .nav-user .btn-nav-ghost {
      font-size: 12px; color: var(--accent); padding: 5px 12px;
      border: 1px solid rgba(255, 77, 141, 0.35); border-radius: 980px;
    }
    .nav-user .btn-nav-ghost:hover { background: var(--accent-soft); }
    .nav-user .btn-nav-solid {
      font-size: 12px; color: #fff;
      background: linear-gradient(135deg, #ff4d8d, #ff7a45);
      padding: 5px 14px; border-radius: 980px; font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 77, 141, 0.3);
    }
    .nav-user .btn-nav-solid:hover { filter: brightness(1.05); }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      font-weight: 600; color: var(--text); font-size: 13px;
      flex-shrink: 0; letter-spacing: 0;
    }
    .avatar.lg { width: 56px; height: 56px; font-size: 20px; }
    .avatar.sm { width: 26px; height: 26px; font-size: 11px; }

    /* ——— Layout ——— */
    .page {
      max-width: var(--max);
      margin: 28px auto 56px;
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr) 248px;
      gap: 20px;
      padding: 0 22px;
    }
    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; margin-top: 16px; }
      .sidebar, .rightbar { display: none; }
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 77, 141, 0.08);
    }

    .sidebar .menu { padding: 10px 8px; }
    .sidebar .menu button {
      width: 100%; text-align: left;
      padding: 10px 14px; font-size: 14px; color: var(--text-2);
      display: flex; align-items: center; gap: 10px;
      border-radius: 10px; font-weight: 400; transition: background .15s, color .15s;
    }
    .sidebar .menu button:hover { background: var(--accent-soft); color: var(--accent); }
    .sidebar .menu button.active {
      background: linear-gradient(135deg, rgba(255,77,141,.14), rgba(255,122,69,.12));
      color: var(--accent);
      font-weight: 600;
    }
    .ico { width: 18px; text-align: center; font-size: 14px; opacity: .85; }

    /* ——— Composer ——— */
    .composer { padding: 22px 24px; margin-bottom: 16px; }
    .composer-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 14px; gap: 12px;
    }
    .composer-head h2 {
      font-size: 21px; font-weight: 600; letter-spacing: -0.016em;
      line-height: 1.2;
    }
    .composer-head .hint { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
    .composer textarea {
      width: 100%; min-height: 110px; resize: vertical;
      border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
      padding: 14px 16px; outline: none; font-size: 17px;
      background: var(--bg); color: var(--text);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .composer textarea::placeholder { color: var(--text-3); }
    .composer textarea:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.14);
    }
    .media-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 10px; margin-top: 14px;
    }
    .media-item {
      position: relative; aspect-ratio: 1;
      border-radius: 14px; overflow: hidden;
      background: var(--bg); border: 1px solid var(--line-soft);
    }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
    .media-item .rm {
      position: absolute; top: 6px; right: 6px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(29, 29, 31, 0.55); color: #fff; font-size: 15px;
      display: grid; place-items: center; backdrop-filter: blur(8px);
    }
    .composer-bar {
      display: flex; align-items: center; gap: 4px;
      margin-top: 16px; flex-wrap: wrap;
    }
    .tool-btn {
      padding: 7px 12px; border-radius: 980px; color: var(--text-2); font-size: 13px;
      transition: background .15s, color .15s;
    }
    .tool-btn:hover { background: rgba(0,0,0,.04); color: var(--accent); }
    .composer-bar .spacer { flex: 1; }
    .char-count { font-size: 12px; color: var(--text-3); margin-right: 10px; }
    .btn-primary {
      background: linear-gradient(135deg, #ff4d8d, #ff7a45);
      color: #fff;
      padding: 9px 22px; border-radius: 980px; font-weight: 600; font-size: 14px;
      transition: filter .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 6px 16px rgba(255, 77, 141, 0.28);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .btn-primary.block { width: 100%; padding: 12px 22px; font-size: 17px; }
    .btn-primary.sm { padding: 6px 16px; font-size: 13px; }
    .btn-ghost {
      padding: 9px 18px; border-radius: 980px;
      border: 1px solid var(--line); color: var(--text); font-size: 14px;
      transition: border-color .15s, background .15s;
    }
    .btn-ghost:hover { background: rgba(0,0,0,.03); }

    .emoji-pop {
      display: none; position: absolute; z-index: 50;
      width: 292px; max-height: 220px; overflow: auto;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px; box-shadow: var(--shadow-lg);
      padding: 10px; grid-template-columns: repeat(8, 1fr); gap: 2px;
    }
    .emoji-pop.open { display: grid; }
    .emoji-pop button {
      font-size: 20px; padding: 6px; border-radius: 8px; line-height: 1.2;
    }
    .emoji-pop button:hover { background: var(--accent-soft); }
    .tool-wrap { position: relative; }

    /* ——— Feed ——— */
    .feed-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 77, 141, 0.08);
    }
    .feed-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--line-soft);
      padding: 0 12px; background: transparent;
    }
    .feed-tabs button {
      padding: 16px 18px; font-size: 14px; color: var(--text-2);
      position: relative; font-weight: 400; letter-spacing: -0.016em;
    }
    .feed-tabs button.active {
      color: var(--accent); font-weight: 600;
    }
    .feed-tabs button.active::after {
      content: ""; position: absolute; left: 18px; right: 18px; bottom: 0;
      height: 3px; background: linear-gradient(90deg, #ff4d8d, #ff7a45); border-radius: 2px;
    }
    #feed.panel { border: none; box-shadow: none; border-radius: 0; }
    .post {
      background: transparent;
      padding: 22px 24px 10px;
      border-bottom: 1px solid var(--line-soft);
    }
    .post:last-child { border-bottom: none; }
    .post-head { display: flex; gap: 12px; align-items: flex-start; }
    .post-meta { flex: 1; min-width: 0; }
    .post-name { font-weight: 600; font-size: 15px; letter-spacing: -0.016em; }
    .post-time { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .post-delete {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
      color: var(--text-3); transition: color .15s, background .15s, transform .15s;
    }
    .post-delete svg { width: 17px; height: 17px; display: block; }
    .post-delete:hover {
      color: var(--danger);
      background: rgba(255, 75, 75, 0.12);
      transform: scale(1.06);
    }
    .post-actions button.on-del:hover { color: var(--danger); background: rgba(255, 59, 48, 0.08); }
    .post-body {
      margin: 12px 0 14px 44px;
      font-size: 17px; white-space: pre-wrap; word-break: break-word;
      line-height: 1.5; letter-spacing: -0.022em;
    }
    .post-media {
      margin: 0 0 14px 44px;
      display: grid; gap: 6px;
    }
    .post-media.grid-1 { grid-template-columns: 1fr; max-width: 420px; }
    .post-media.grid-2 { grid-template-columns: 1fr 1fr; max-width: 420px; }
    .post-media.grid-3 { grid-template-columns: repeat(3, 1fr); max-width: 420px; }
    .post-media .cell {
      border-radius: 14px; overflow: hidden; background: var(--bg);
      aspect-ratio: 1; cursor: zoom-in;
    }
    .post-media .cell.video { aspect-ratio: 16/9; cursor: default; }
    .post-media .cell img, .post-media .cell video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .post-actions {
      display: flex; margin-left: 32px;
      border-top: 1px solid var(--line-soft); padding-top: 2px;
    }
    .post-actions button {
      flex: 1; padding: 12px; color: var(--text-3); font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 10px; transition: color .15s, background .15s;
    }
    .post-actions button:hover { color: var(--accent); background: var(--accent-soft); }
    .post-actions button.on-like { color: var(--like); }
    .post-actions button.on-fav { color: var(--accent); }

    .comments {
      margin: 0 0 12px 44px;
      background: var(--bg); border-radius: 14px; padding: 12px 14px;
    }
    .comment {
      display: flex; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--line-soft); font-size: 14px;
    }
    .comment:last-of-type { border-bottom: none; }
    .comment .c-body { flex: 1; }
    .comment .c-name { color: var(--accent); font-weight: 500; margin-right: 6px; }
    .comment .c-time { color: var(--text-3); font-size: 12px; margin-top: 4px; }
    .comment-empty { font-size: 13px; color: var(--text-3); padding: 6px 0; }
    .comment-form {
      display: flex; gap: 8px; margin-top: 8px; align-items: center;
    }
    .comment-form input {
      flex: 1; border: 1px solid transparent; border-radius: 980px;
      padding: 8px 14px; outline: none; font-size: 14px;
      background: #fff;
    }
    .comment-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 77, 141, 0.14);
    }
    .comment-form button {
      color: var(--accent); font-size: 14px; font-weight: 500; padding: 4px 10px;
    }

    .empty {
      padding: 64px 24px; text-align: center; color: var(--text-3);
      background: transparent; font-size: 14px;
    }

    .rightbar .panel { padding: 20px; margin-bottom: 16px; }
    .rightbar h3 {
      font-size: 12px; margin-bottom: 12px; color: var(--text-3);
      font-weight: 600; letter-spacing: -0.01em;
    }
    .hot-item {
      display: flex; gap: 10px; padding: 10px 0; font-size: 14px;
      border-bottom: 1px solid var(--line-soft); color: var(--text);
    }
    .hot-item:last-child { border-bottom: none; }
    .hot-rank {
      width: 16px; color: var(--text-3); font-weight: 600; flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .hot-item:nth-child(-n+3) .hot-rank { color: var(--accent); }
    .profile-card { text-align: center; }
    .profile-card .avatar { margin: 0 auto; }
    .profile-card .name {
      font-weight: 600; margin: 12px 0 4px; font-size: 19px;
      letter-spacing: -0.022em;
    }
    .profile-card .bio { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }
    .stats {
      display: flex; justify-content: center; gap: 24px;
      font-size: 12px; color: var(--text-3);
    }
    .stats b {
      display: block; font-size: 21px; color: var(--text);
      font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;
    }
    .profile-card .btn-primary { margin-top: 14px; }

    /* ——— Overlays ——— */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0, 0, 0, 0.4);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .overlay.show { display: flex; }
    .modal {
      background: #fff; border-radius: 20px; width: 100%; max-width: 400px;
      padding: 32px 28px 28px; position: relative;
      box-shadow: var(--shadow-lg);
      animation: pop .28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal.wide { max-width: 440px; }
    @keyframes pop {
      from { transform: scale(.96) translateY(8px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .modal h2 {
      font-size: 28px; margin-bottom: 6px; font-weight: 600;
      letter-spacing: -0.02em; line-height: 1.15;
    }
    .modal .sub { font-size: 14px; color: var(--text-2); margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field.tight { margin-bottom: 0; }
    .field label {
      display: block; font-size: 12px; margin-bottom: 6px;
      color: var(--text-2); font-weight: 500;
    }
    .field input {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; outline: none; background: var(--bg);
      font-size: 17px; transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .field input:focus {
      border-color: var(--accent); background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.14);
    }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-2); }
    .auth-err {
      background: #fff2f1; color: var(--danger); font-size: 13px;
      padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; display: none;
    }
    .auth-err.show { display: block; }
    .modal-close {
      position: absolute; top: 14px; right: 16px;
      width: 30px; height: 30px; border-radius: 50%;
      font-size: 20px; color: var(--text-3); line-height: 1;
      display: grid; place-items: center;
    }
    .modal-close:hover { background: rgba(0,0,0,.05); color: var(--text); }

    .captcha-title {
      font-size: 21px; font-weight: 600; margin-bottom: 6px;
      letter-spacing: -0.016em;
    }
    .captcha-desc { font-size: 14px; color: var(--text-2); margin-bottom: 20px; }
    .captcha-badge {
      display: inline-block; font-size: 11px; padding: 3px 10px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 980px; margin-bottom: 12px; font-weight: 500;
    }
    .captcha-err {
      color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 20px;
    }
    .captcha-actions {
      display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
    }

    .slider-track {
      position: relative; height: 44px; background: var(--bg);
      border-radius: 980px; overflow: hidden; user-select: none;
      border: 1px solid var(--line-soft);
    }
    .slider-fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: linear-gradient(90deg, #ffd0e4, #ffc4a8);
    }
    .slider-text {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-size: 13px; color: var(--text-3); pointer-events: none;
    }
    .slider-knob {
      position: absolute; left: 0; top: 0;
      width: 48px; height: 44px;
      background: #fff; border-radius: 980px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: grid; place-items: center;
      cursor: grab; color: var(--accent); font-size: 16px; z-index: 2;
      touch-action: none; font-weight: 600;
    }
    .slider-knob:active { cursor: grabbing; }
    .slider-track.ok { background: #e8f8ec; border-color: #b7ebc6; }
    .slider-track.ok .slider-fill { background: #c6efd0; width: 100% !important; }
    .slider-track.ok .slider-text { color: #248a3d; }

    .pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pick-cell {
      aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent;
      background: var(--bg); font-size: 40px;
      display: grid; place-items: center;
      transition: border-color .15s, background .15s, transform .12s;
    }
    .pick-cell:hover { transform: scale(1.02); }
    .pick-cell.selected {
      border-color: var(--accent); background: var(--accent-soft);
    }

    .text-captcha-row {
      display: flex; gap: 12px; align-items: center; margin-bottom: 14px;
    }
    #captchaCanvas {
      border-radius: 12px; border: 1px solid var(--line-soft); cursor: pointer;
      background: var(--bg);
    }
    .refresh-captcha {
      font-size: 14px; color: var(--accent); padding: 6px 8px; font-weight: 500;
    }

    .seq-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .seq-cell {
      aspect-ratio: 1; border-radius: 14px;
      background: var(--bg);
      border: 1px solid var(--line-soft);
      font-size: 22px; font-weight: 600; color: var(--text);
      display: grid; place-items: center;
      transition: .15s; letter-spacing: 0;
    }
    .seq-cell:hover { border-color: var(--accent); background: #fff; }
    .seq-cell.done {
      background: var(--accent); color: #fff; border-color: var(--accent);
      pointer-events: none;
    }
    .seq-progress { font-size: 14px; color: var(--text-2); margin-bottom: 12px; }

    .lightbox {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.82);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .lightbox.show { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }

    .toast {
      position: fixed; left: 50%; bottom: 40px;
      transform: translateX(-50%) translateY(12px);
      background: linear-gradient(135deg, #ff4d8d, #ff7a45); color: #fff;
      padding: 12px 22px; border-radius: 980px; font-size: 14px;
      opacity: 0; pointer-events: none; transition: .28s cubic-bezier(0.22,1,0.36,1);
      z-index: 400;
      box-shadow: 0 10px 30px rgba(255, 77, 141, 0.35);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .guest-banner {
      background: linear-gradient(135deg, #fff, #fff5f8);
      color: var(--text-2);
      padding: 14px 18px; font-size: 14px; border-radius: var(--radius);
      margin-bottom: 16px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
      border: 1px solid rgba(255, 77, 141, 0.12); box-shadow: var(--shadow);
    }
    .guest-banner[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topnav">
    <div class="topnav-inner">
      <div class="brand"><span class="brand-mark">微</span>微博</div>
      <div class="search">
        <input type="search" placeholder="搜索微博 / 用户 / 话题" aria-label="搜索" />
      </div>
      <div class="nav-links">
        <button type="button" data-view="home">首页</button>
        <button type="button" id="navFav" data-view="fav">收藏</button>
      </div>
      <div class="nav-user" id="navUser">
        <!-- filled by JS -->
      </div>
    </div>
  </header>

  <main class="page">
    <aside class="sidebar">
      <div class="panel">
        <nav class="menu">
          <button type="button" class="active" data-view="home"><span class="ico">🏠</span>首页</button>
          <button type="button" data-view="fav"><span class="ico">⭐</span>我的收藏</button>
          <button type="button" id="menuMine" data-view="mine"><span class="ico">✨</span>我的微博</button>
        </nav>
      </div>
    </aside>

    <section class="main" id="mainCol">
      <div class="guest-banner" id="guestBanner" hidden>
        <span>登录后可发帖、评论、点赞与收藏</span>
        <button type="button" class="btn-primary sm" id="guestLoginBtn">立即登录</button>
      </div>

      <div class="panel composer" id="composerPanel">
        <div class="composer-head">
          <h2>有什么新鲜事想告诉大家？</h2>
          <span class="hint">发帖时可能触发真人验证</span>
        </div>
        <textarea id="postInput" maxlength="2000" placeholder="分享你的新鲜事… 支持文字、图片、视频和 emoji"></textarea>
        <div class="media-preview" id="mediaPreview"></div>
        <div class="composer-bar">
          <div class="tool-wrap">
            <button type="button" class="tool-btn" id="emojiBtn" title="表情">😊 表情</button>
            <div class="emoji-pop" id="emojiPop" role="listbox"></div>
          </div>
          <button type="button" class="tool-btn" id="imgBtn" title="图片">🖼️ 图片</button>
          <button type="button" class="tool-btn" id="vidBtn" title="视频">🎬 视频</button>
          <input type="file" id="imgInput" accept="image/*" multiple hidden />
          <input type="file" id="vidInput" accept="video/*" hidden />
          <span class="spacer"></span>
          <span class="char-count"><span id="charCount">0</span>/2000</span>
          <button type="button" class="btn-primary" id="publishBtn">发布</button>
        </div>
      </div>

      <div class="feed-wrap">
        <div class="feed-tabs">
          <button type="button" class="active" data-tab="all">全部</button>
          <button type="button" data-tab="fav">收藏</button>
          <button type="button" data-tab="mine">我的</button>
        </div>
        <div id="feed" class="panel"></div>
      </div>
    </section>

    <aside class="rightbar">
      <div class="panel profile-card" id="profileCard">
        <!-- filled by JS -->
      </div>
      <div class="panel">
        <h3>热门话题</h3>
        <ul>
          <li class="hot-item"><span class="hot-rank">1</span><span>#春天的第一杯奶茶#</span></li>
          <li class="hot-item"><span class="hot-rank">2</span><span>#今日宜发微博#</span></li>
          <li class="hot-item"><span class="hot-rank">3</span><span>#真人验证挑战#</span></li>
          <li class="hot-item"><span class="hot-rank">4</span><span>#周末去哪儿#</span></li>
          <li class="hot-item"><span class="hot-rank">5</span><span>#代码能治百病吗#</span></li>
        </ul>
      </div>
    </aside>
  </main>

  <!-- Auth -->
  <div class="overlay" id="authOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <button type="button" class="modal-close" id="authClose" aria-label="关闭">×</button>
      <h2 id="authTitle">登录微博</h2>
      <p class="sub" id="authSub">使用账号密码登录模拟社区</p>
      <div class="auth-err" id="authErr"></div>
      <div class="field" id="nickField" hidden>
        <label for="regNick">昵称</label>
        <input id="regNick" maxlength="20" placeholder="你的显示名称" />
      </div>
      <div class="field">
        <label for="authUser">用户名</label>
        <input id="authUser" autocomplete="username" placeholder="字母数字，至少 3 位" />
      </div>
      <div class="field">
        <label for="authPass">密码</label>
        <input id="authPass" type="password" autocomplete="current-password" placeholder="至少 6 位" />
      </div>
      <button type="button" class="btn-primary block" id="authSubmit">登录</button>
      <div class="auth-switch">
        <span id="authSwitchText">还没有账号？</span>
        <a href="#" id="authSwitchLink">立即注册</a>
      </div>
    </div>
  </div>

  <!-- Captcha -->
  <div class="overlay" id="captchaOverlay" role="dialog" aria-modal="true">
    <div class="modal wide" id="captchaModal">
      <span class="captcha-badge" id="captchaBadge">安全验证</span>
      <div class="captcha-title" id="captchaTitle">请完成验证</div>
      <div class="captcha-desc" id="captchaDesc"></div>
      <div id="captchaBody"></div>
      <div class="captcha-err" id="captchaErr"></div>
      <div class="captcha-actions" id="captchaActions"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="预览" /></div>
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const STORAGE = {
        users: "wb_sim_users",
        session: "wb_sim_session",
        posts: "wb_sim_posts",
      };

      const EMOJIS = "😀😁😂🤣😊😍🥰😎🤩😭😤👍👎👏🙏🔥✨💯🎉❤️🧡💛💚💙💜🖤🤍🤎💔🌹🌸☀️🌙⭐⭐️🌈🍕🍜☕🎵📱💻🚀🐶🐱🐼🦊🐨🐯".split(/(?:)/u).filter(Boolean);

      const AVATAR_COLORS = ["#ffd0e0", "#ffd8c2", "#ffe6a8", "#d8f5e2", "#d4e8ff", "#ead7ff"];

      let state = {
        user: null,
        posts: [],
        view: "all",
        pendingPost: null,
        authMode: "login",
        draftMedia: [],
      };

      /* ——— persistence ——— */
      function loadJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch { return fallback; }
      }
      function saveJSON(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
      }

      function getUsers() { return loadJSON(STORAGE.users, {}); }
      function saveUsers(u) { saveJSON(STORAGE.users, u); }

      function initDemoPosts() {
        const existing = loadJSON(STORAGE.posts, null);
        if (existing) return existing;
        const demo = [
          {
            id: "p1",
            userId: "demo",
            nick: "微博小秘书",
            text: "欢迎来到微博模拟社区！试试发一条带图片或表情的微博吧 ✨\n发帖时有几率弹出真人验证哦～",
            media: [],
            likes: ["demo"],
            favs: [],
            comments: [
              { id: "c1", userId: "demo", nick: "微博小秘书", text: "评论功能也可用～", time: Date.now() - 3600000 }
            ],
            time: Date.now() - 86400000,
          },
          {
            id: "p2",
            userId: "demo",
            nick: "热搜观察员",
            text: "今日热搜：#真人验证挑战# 你能一次通过三种验证吗？😎",
            media: [],
            likes: [],
            favs: [],
            comments: [],
            time: Date.now() - 7200000,
          },
        ];
        saveJSON(STORAGE.posts, demo);
        return demo;
      }

      /* ——— auth ——— */
      function hashPass(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
        return "h" + Math.abs(h).toString(36);
      }

      function currentUser() {
        const sid = localStorage.getItem(STORAGE.session);
        if (!sid) return null;
        const users = getUsers();
        return users[sid] ? { ...users[sid], username: sid } : null;
      }

      function login(username, password) {
        const users = getUsers();
        const u = users[username];
        if (!u || u.pass !== hashPass(password)) return "用户名或密码错误";
        localStorage.setItem(STORAGE.session, username);
        state.user = { ...u, username };
        return null;
      }

      function register(username, password, nick) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) return "用户名需为 3–20 位字母数字或下划线";
        if (password.length < 6) return "密码至少 6 位";
        if (!nick.trim()) return "请填写昵称";
        const users = getUsers();
        if (users[username]) return "用户名已被占用";
        users[username] = {
          nick: nick.trim().slice(0, 20),
          pass: hashPass(password),
          bio: "这个人很懒，什么都没写",
          created: Date.now(),
        };
        saveUsers(users);
        localStorage.setItem(STORAGE.session, username);
        state.user = { ...users[username], username };
        return null;
      }

      function logout() {
        localStorage.removeItem(STORAGE.session);
        state.user = null;
        renderAll();
        toast("已退出登录");
      }

      /* ——— UI helpers ——— */
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove("show"), 2200);
      }

      function avatarHTML(nick, size = "") {
        const ch = (nick || "?").slice(0, 1);
        const color = AVATAR_COLORS[(nick || "").length % AVATAR_COLORS.length];
        return `<div class="avatar ${size}" style="background:${color}" aria-hidden="true">${ch}</div>`;
      }

      function timeAgo(ts) {
        const d = Date.now() - ts;
        if (d < 60000) return "刚刚";
        if (d < 3600000) return Math.floor(d / 60000) + " 分钟前";
        if (d < 86400000) return Math.floor(d / 3600000) + " 小时前";
        if (d < 604800000) return Math.floor(d / 86400000) + " 天前";
        return new Date(ts).toLocaleDateString("zh-CN");
      }

      function requireAuth(action) {
        if (state.user) return true;
        openAuth("login");
        toast("请先登录后再" + action);
        return false;
      }

      /* ——— render ——— */
      function renderNav() {
        const box = document.getElementById("navUser");
        if (state.user) {
          box.innerHTML = `
            ${avatarHTML(state.user.nick)}
            <span class="nav-nick">${escapeHtml(state.user.nick)}</span>
            <button type="button" class="btn-nav-text" id="logoutBtn">退出</button>
          `;
          document.getElementById("logoutBtn").onclick = logout;
        } else {
          box.innerHTML = `
            <button type="button" class="btn-nav-ghost" id="openLogin">登录</button>
            <button type="button" class="btn-nav-solid" id="openReg">注册</button>
          `;
          document.getElementById("openLogin").onclick = () => openAuth("login");
          document.getElementById("openReg").onclick = () => openAuth("register");
        }
      }

      function renderProfile() {
        const card = document.getElementById("profileCard");
        const myPosts = state.posts.filter(p => state.user && p.userId === state.user.username);
        const myFavs = state.posts.filter(p => state.user && p.favs.includes(state.user.username));
        if (state.user) {
          card.innerHTML = `
            ${avatarHTML(state.user.nick, "lg")}
            <div class="name">${escapeHtml(state.user.nick)}</div>
            <div class="bio">@${escapeHtml(state.user.username)} · ${escapeHtml(state.user.bio)}</div>
            <div class="stats">
              <div><b>${myPosts.length}</b>微博</div>
              <div><b>${myFavs.length}</b>收藏</div>
              <div><b>${state.posts.reduce((n,p)=>n+(p.likes.includes(state.user.username)?1:0),0)}</b>赞过</div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="avatar lg" style="background:linear-gradient(135deg,#ffd0e0,#ffd8c2)">微</div>
            <div class="name">游客</div>
            <div class="bio">登录后开启完整体验</div>
            <button type="button" class="btn-primary block" id="cardLogin">登录 / 注册</button>
          `;
          document.getElementById("cardLogin").onclick = () => openAuth("login");
        }
      }

      function renderComposerState() {
        const guest = document.getElementById("guestBanner");
        const composer = document.getElementById("composerPanel");
        if (state.user) {
          guest.hidden = true;
          composer.style.opacity = "1";
          composer.querySelectorAll("textarea,button,input").forEach(el => { el.disabled = false; });
        } else {
          guest.hidden = false;
          composer.style.opacity = ".65";
        }
      }

      function filteredPosts() {
        let list = [...state.posts].sort((a, b) => b.time - a.time);
        if (state.view === "fav") {
          if (!state.user) return [];
          list = list.filter(p => p.favs.includes(state.user.username));
        } else if (state.view === "mine") {
          if (!state.user) return [];
          list = list.filter(p => p.userId === state.user.username);
        }
        return list;
      }

      function renderFeed() {
        const feed = document.getElementById("feed");
        const posts = filteredPosts();
        document.querySelectorAll(".feed-tabs button").forEach(b => {
          b.classList.toggle("active", b.dataset.tab === state.view);
        });
        document.querySelectorAll(".sidebar .menu button").forEach(b => {
          const map = { home: "all", fav: "fav", mine: "mine" };
          b.classList.toggle("active", map[b.dataset.view] === state.view);
        });

        if (!posts.length) {
          feed.innerHTML = `<div class="empty">${
            state.view === "fav" ? "还没有收藏，去给喜欢的微博点个星吧" :
            state.view === "mine" ? "你还没有发过微博" : "暂无内容"
          }</div>`;
          return;
        }

        feed.innerHTML = posts.map(p => {
          const liked = state.user && p.likes.includes(state.user.username);
          const faved = state.user && p.favs.includes(state.user.username);
          const isOwner = state.user && p.userId === state.user.username;
          const showComments = p._openComments;
          return `
            <article class="post" data-id="${p.id}">
              <div class="post-head">
                ${avatarHTML(p.nick)}
                <div class="post-meta">
                  <div class="post-name">${escapeHtml(p.nick)}</div>
                  <div class="post-time">${timeAgo(p.time)}</div>
                </div>
                ${isOwner ? `<button type="button" class="post-delete" data-act="delete" title="删除这条微博" aria-label="删除">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/>
                  </svg>
                </button>` : ""}
              </div>
              <div class="post-body">${linkify(escapeHtml(p.text))}</div>
              ${renderMedia(p.media)}
              <div class="post-actions">
                <button type="button" data-act="comment">💬 评论 ${p.comments.length || ""}</button>
                <button type="button" data-act="like" class="${liked ? "on-like" : ""}">${liked ? "❤️" : "🤍"} ${p.likes.length || "赞"}</button>
                <button type="button" data-act="fav" class="${faved ? "on-fav" : ""}">${faved ? "⭐" : "☆"} ${faved ? "已收藏" : "收藏"}</button>
              </div>
              ${showComments ? renderComments(p) : ""}
            </article>
          `;
        }).join("");

        feed.querySelectorAll(".post").forEach(el => {
          const id = el.dataset.id;
          const post = state.posts.find(x => x.id === id);
          el.querySelector('[data-act="like"]').onclick = () => toggleLike(id);
          el.querySelector('[data-act="fav"]').onclick = () => toggleFav(id);
          el.querySelector('[data-act="comment"]').onclick = () => {
            post._openComments = !post._openComments;
            renderFeed();
          };
          const delBtn = el.querySelector('[data-act="delete"]');
          if (delBtn) delBtn.onclick = () => deletePost(id);
          el.querySelectorAll(".cell img").forEach(img => {
            img.onclick = () => {
              document.getElementById("lightboxImg").src = img.src;
              document.getElementById("lightbox").classList.add("show");
            };
          });
          const form = el.querySelector(".comment-form");
          if (form) {
            form.onsubmit = (e) => {
              e.preventDefault();
              const input = form.querySelector("input");
              addComment(id, input.value);
            };
          }
        });
      }

      function renderMedia(media) {
        if (!media || !media.length) return "";
        const n = Math.min(media.length, 9);
        const cls = n === 1 ? "grid-1" : n === 2 ? "grid-2" : "grid-3";
        return `<div class="post-media ${cls}">${media.slice(0, 9).map(m => {
          if (m.type === "video") {
            return `<div class="cell video"><video src="${m.url}" controls playsinline></video></div>`;
          }
          return `<div class="cell"><img src="${m.url}" alt="配图" /></div>`;
        }).join("")}</div>`;
      }

      function renderComments(p) {
        const list = p.comments.map(c => `
          <div class="comment">
            ${avatarHTML(c.nick, "sm")}
            <div class="c-body">
              <div><span class="c-name">${escapeHtml(c.nick)}</span>${escapeHtml(c.text)}</div>
              <div class="c-time">${timeAgo(c.time)}</div>
            </div>
          </div>
        `).join("");
        return `
          <div class="comments">
            ${list || '<div class="comment-empty">暂无评论，来说两句吧</div>'}
            <form class="comment-form">
              <input type="text" maxlength="200" placeholder="${state.user ? "写下你的评论…" : "登录后评论"}" ${state.user ? "" : "disabled"} />
              <button type="submit" ${state.user ? "" : "disabled"}>发送</button>
            </form>
          </div>
        `;
      }

      function renderMediaPreview() {
        const box = document.getElementById("mediaPreview");
        box.innerHTML = state.draftMedia.map((m, i) => `
          <div class="media-item">
            ${m.type === "video"
              ? `<video src="${m.url}" muted></video>`
              : `<img src="${m.url}" alt="" />`}
            <button type="button" class="rm" data-i="${i}" aria-label="移除">×</button>
          </div>
        `).join("");
        box.querySelectorAll(".rm").forEach(btn => {
          btn.onclick = () => {
            state.draftMedia.splice(+btn.dataset.i, 1);
            renderMediaPreview();
          };
        });
      }

      function renderAll() {
        renderNav();
        renderProfile();
        renderComposerState();
        renderFeed();
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function linkify(s) {
        return s.replace(/#([^#\s]+)#/g, '<a href="#">#$1#</a>');
      }

      /* ——— post actions ——— */
      function savePosts() {
        const clean = state.posts.map(({ _openComments, ...rest }) => rest);
        saveJSON(STORAGE.posts, clean);
      }

      function toggleLike(id) {
        if (!requireAuth("点赞")) return;
        const p = state.posts.find(x => x.id === id);
        const i = p.likes.indexOf(state.user.username);
        if (i >= 0) p.likes.splice(i, 1);
        else p.likes.push(state.user.username);
        savePosts();
        renderFeed();
        renderProfile();
      }

      function toggleFav(id) {
        if (!requireAuth("收藏")) return;
        const p = state.posts.find(x => x.id === id);
        const i = p.favs.indexOf(state.user.username);
        if (i >= 0) {
          p.favs.splice(i, 1);
          toast("已取消收藏");
        } else {
          p.favs.push(state.user.username);
          toast("收藏成功");
        }
        savePosts();
        renderFeed();
        renderProfile();
      }

      function deletePost(id) {
        if (!requireAuth("删除")) return;
        const p = state.posts.find(x => x.id === id);
        if (!p || p.userId !== state.user.username) {
          toast("只能删除自己的微博");
          return;
        }
        if (!confirm("确定删除这条微博？删除后无法恢复。")) return;
        state.posts = state.posts.filter(x => x.id !== id);
        savePosts();
        renderAll();
        toast("已删除");
      }

      function addComment(id, text) {
        if (!requireAuth("评论")) return;
        text = (text || "").trim();
        if (!text) return;
        const p = state.posts.find(x => x.id === id);
        p.comments.push({
          id: "c" + Date.now(),
          userId: state.user.username,
          nick: state.user.nick,
          text,
          time: Date.now(),
        });
        p._openComments = true;
        savePosts();
        renderFeed();
        toast("评论成功");
      }

      function tryPublish() {
        if (!requireAuth("发帖")) return;
        const text = document.getElementById("postInput").value.trim();
        if (!text && !state.draftMedia.length) {
          toast("写点什么或添加媒体再发布");
          return;
        }
        state.pendingPost = {
          id: "p" + Date.now(),
          userId: state.user.username,
          nick: state.user.nick,
          text,
          media: [...state.draftMedia],
          likes: [],
          favs: [],
          comments: [],
          time: Date.now(),
        };

        // ~70% chance to trigger captcha (always trigger if you want demo: change to true)
        const needCaptcha = Math.random() < 0.7;
        if (needCaptcha) {
          startRandomCaptcha(() => finalizePublish());
        } else {
          finalizePublish();
        }
      }

      function finalizePublish() {
        state.posts.unshift(state.pendingPost);
        state.pendingPost = null;
        document.getElementById("postInput").value = "";
        document.getElementById("charCount").textContent = "0";
        state.draftMedia = [];
        renderMediaPreview();
        savePosts();
        state.view = "all";
        renderAll();
        toast("发布成功");
      }

      /* ========== CAPTCHA: 4 implementations ========== */

      const CAPTCHA_TYPES = ["slider", "imagePick", "textCode", "sequence"];

      function startRandomCaptcha(onSuccess) {
        const type = CAPTCHA_TYPES[Math.floor(Math.random() * CAPTCHA_TYPES.length)];
        openCaptcha(type, onSuccess);
      }

      function openCaptcha(type, onSuccess) {
        const overlay = document.getElementById("captchaOverlay");
        const badge = document.getElementById("captchaBadge");
        const title = document.getElementById("captchaTitle");
        const desc = document.getElementById("captchaDesc");
        const body = document.getElementById("captchaBody");
        const actions = document.getElementById("captchaActions");
        const err = document.getElementById("captchaErr");
        err.textContent = "";
        actions.innerHTML = "";
        body.innerHTML = "";

        const labels = {
          slider: "方式① 滑动验证",
          imagePick: "方式② 图片点选",
          textCode: "方式③ 字符识别",
          sequence: "方式④ 顺序点击",
        };
        badge.textContent = labels[type];

        let controller;
        if (type === "slider") controller = captchaSlider(body, title, desc, actions, err, onSuccess);
        else if (type === "imagePick") controller = captchaImagePick(body, title, desc, actions, err, onSuccess);
        else if (type === "textCode") controller = captchaTextCode(body, title, desc, actions, err, onSuccess);
        else controller = captchaSequence(body, title, desc, actions, err, onSuccess);

        overlay.classList.add("show");
        overlay._close = () => {
          overlay.classList.remove("show");
          state.pendingPost = null;
        };
      }

      function closeCaptcha() {
        document.getElementById("captchaOverlay").classList.remove("show");
      }

      function captchaPass(onSuccess) {
        closeCaptcha();
        toast("验证通过");
        onSuccess();
      }

      /* 1) Slider puzzle */
      function captchaSlider(body, title, desc, actions, err, onSuccess) {
        title.textContent = "拖动滑块完成验证";
        desc.textContent = "将滑块拖到最右侧，证明你不是机器人";
        body.innerHTML = `
          <div class="slider-track" id="sliderTrack">
            <div class="slider-fill" id="sliderFill"></div>
            <div class="slider-text" id="sliderText">按住滑块拖动到最右边</div>
            <div class="slider-knob" id="sliderKnob" role="slider" aria-valuemin="0" aria-valuemax="100">››</div>
          </div>
        `;
        actions.innerHTML = `<button type="button" class="btn-ghost" id="captchaCancel">取消发帖</button>`;
        document.getElementById("captchaCancel").onclick = () => {
          document.getElementById("captchaOverlay")._close();
          toast("已取消发布");
        };

        const track = document.getElementById("sliderTrack");
        const knob = document.getElementById("sliderKnob");
        const fill = document.getElementById("sliderFill");
        const text = document.getElementById("sliderText");
        let dragging = false;
        let startX = 0;
        let startLeft = 0;
        const max = () => track.clientWidth - knob.offsetWidth;

        const onDown = (e) => {
          dragging = true;
          startX = (e.touches ? e.touches[0].clientX : e.clientX);
          startLeft = knob.offsetLeft;
          e.preventDefault();
        };
        const onMove = (e) => {
          if (!dragging) return;
          const x = e.touches ? e.touches[0].clientX : e.clientX;
          let left = Math.max(0, Math.min(max(), startLeft + (x - startX)));
          knob.style.left = left + "px";
          fill.style.width = (left + knob.offsetWidth / 2) + "px";
        };
        const onUp = () => {
          if (!dragging) return;
          dragging = false;
          if (knob.offsetLeft >= max() - 4) {
            track.classList.add("ok");
            text.textContent = "验证成功";
            knob.style.left = max() + "px";
            setTimeout(() => captchaPass(onSuccess), 350);
          } else {
            knob.style.transition = "left .25s";
            fill.style.transition = "width .25s";
            knob.style.left = "0";
            fill.style.width = "0";
            err.textContent = "请拖到最右侧";
            setTimeout(() => {
              knob.style.transition = "";
              fill.style.transition = "";
              err.textContent = "";
            }, 400);
          }
        };
        knob.addEventListener("mousedown", onDown);
        knob.addEventListener("touchstart", onDown, { passive: false });
        window.addEventListener("mousemove", onMove);
        window.addEventListener("touchmove", onMove, { passive: false });
        window.addEventListener("mouseup", onUp);
        window.addEventListener("touchend", onUp);
      }

      /* 2) Image / emoji pick */
      function captchaImagePick(body, title, desc, actions, err, onSuccess) {
        const animals = [
          { e: "🐱", t: "猫" }, { e: "🐶", t: "狗" }, { e: "🐼", t: "熊猫" },
          { e: "🦊", t: "狐狸" }, { e: "🐯", t: "老虎" }, { e: "🐰", t: "兔子" },
          { e: "🐻", t: "熊" }, { e: "🐨", t: "考拉" }, { e: "🦁", t: "狮子" },
        ];
        const target = animals[Math.floor(Math.random() * animals.length)];
        const pool = [...animals].sort(() => Math.random() - 0.5).slice(0, 9);
        if (!pool.find(a => a.t === target.t)) pool[Math.floor(Math.random() * 9)] = target;

        title.textContent = "请选择正确的图片";
        desc.textContent = `点击所有「${target.t}」—— 共需选中正确项后点确认`;
        body.innerHTML = `<div class="pick-grid" id="pickGrid">${
          pool.map((a, i) => `<button type="button" class="pick-cell" data-t="${a.t}" data-i="${i}">${a.e}</button>`).join("")
        }</div>`;
        actions.innerHTML = `
          <button type="button" class="btn-ghost" id="captchaCancel">取消</button>
          <button type="button" class="btn-primary" id="captchaOk">确认</button>
        `;

        const selected = new Set();
        body.querySelectorAll(".pick-cell").forEach(cell => {
          cell.onclick = () => {
            cell.classList.toggle("selected");
            const i = cell.dataset.i;
            if (selected.has(i)) selected.delete(i);
            else selected.add(i);
          };
        });

        document.getElementById("captchaCancel").onclick = () => {
          document.getElementById("captchaOverlay")._close();
          toast("已取消发布");
        };
        document.getElementById("captchaOk").onclick = () => {
          const cells = [...body.querySelectorAll(".pick-cell")];
          const correct = cells.every(c => {
            const should = c.dataset.t === target.t;
            const isSel = c.classList.contains("selected");
            return should === isSel;
          });
          if (correct && cells.some(c => c.dataset.t === target.t && c.classList.contains("selected"))) {
            captchaPass(onSuccess);
          } else {
            err.textContent = "选择不正确，请重试";
            cells.forEach(c => c.classList.remove("selected"));
            selected.clear();
          }
        };
      }

      /* 3) Distorted text canvas */
      function captchaTextCode(body, title, desc, actions, err, onSuccess) {
        title.textContent = "请输入图中的验证码";
        desc.textContent = "点击图片可刷新；不区分大小写";
        body.innerHTML = `
          <div class="text-captcha-row">
            <canvas id="captchaCanvas" width="160" height="48" title="点击刷新"></canvas>
            <button type="button" class="refresh-captcha" id="refreshCode">换一张</button>
          </div>
          <div class="field tight">
            <input id="captchaInput" maxlength="6" placeholder="输入验证码" autocomplete="off" />
          </div>
        `;
        actions.innerHTML = `
          <button type="button" class="btn-ghost" id="captchaCancel">取消</button>
          <button type="button" class="btn-primary" id="captchaOk">确认</button>
        `;

        let code = "";
        function draw() {
          const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          code = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
          const canvas = document.getElementById("captchaCanvas");
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#f0f4f8";
          ctx.fillRect(0, 0, 160, 48);
          for (let i = 0; i < 5; i++) {
            ctx.strokeStyle = `rgba(${rnd(80,180)},${rnd(80,180)},${rnd(80,180)},.5)`;
            ctx.beginPath();
            ctx.moveTo(rnd(0,160), rnd(0,48));
            ctx.lineTo(rnd(0,160), rnd(0,48));
            ctx.stroke();
          }
          for (let i = 0; i < 30; i++) {
            ctx.fillStyle = `rgba(${rnd(0,200)},${rnd(0,200)},${rnd(0,200)},.35)`;
            ctx.fillRect(rnd(0,160), rnd(0,48), 2, 2);
          }
          for (let i = 0; i < code.length; i++) {
            ctx.save();
            ctx.font = `bold ${rnd(22,28)}px "Courier New", monospace`;
            ctx.fillStyle = `rgb(${rnd(20,100)},${rnd(20,100)},${rnd(20,120)})`;
            ctx.translate(22 + i * 34, 32);
            ctx.rotate((rnd(-25, 25) * Math.PI) / 180);
            ctx.fillText(code[i], 0, 0);
            ctx.restore();
          }
        }
        function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

        draw();
        document.getElementById("captchaCanvas").onclick = draw;
        document.getElementById("refreshCode").onclick = draw;
        document.getElementById("captchaCancel").onclick = () => {
          document.getElementById("captchaOverlay")._close();
          toast("已取消发布");
        };
        document.getElementById("captchaOk").onclick = () => {
          const val = document.getElementById("captchaInput").value.trim().toUpperCase();
          if (val === code) captchaPass(onSuccess);
          else {
            err.textContent = "验证码错误";
            draw();
            document.getElementById("captchaInput").value = "";
          }
        };
        document.getElementById("captchaInput").onkeydown = (e) => {
          if (e.key === "Enter") document.getElementById("captchaOk").click();
        };
        setTimeout(() => document.getElementById("captchaInput").focus(), 50);
      }

      /* 4) Click numbers in ascending order */
      function captchaSequence(body, title, desc, actions, err, onSuccess) {
        const nums = [1, 2, 3, 4, 5, 6, 7, 8];
        const shuffled = [...nums].sort(() => Math.random() - 0.5);
        title.textContent = "请按从小到大顺序点击";
        desc.textContent = "依次点击 1 → 8，点错将重新开始";
        body.innerHTML = `
          <div class="seq-progress" id="seqProg">下一步：点击 <b>1</b></div>
          <div class="seq-grid" id="seqGrid">${
            shuffled.map(n => `<button type="button" class="seq-cell" data-n="${n}">${n}</button>`).join("")
          }</div>
        `;
        actions.innerHTML = `<button type="button" class="btn-ghost" id="captchaCancel">取消发帖</button>`;
        document.getElementById("captchaCancel").onclick = () => {
          document.getElementById("captchaOverlay")._close();
          toast("已取消发布");
        };

        let expect = 1;
        const prog = document.getElementById("seqProg");
        body.querySelectorAll(".seq-cell").forEach(cell => {
          cell.onclick = () => {
            const n = +cell.dataset.n;
            if (n === expect) {
              cell.classList.add("done");
              expect++;
              if (expect > 8) {
                prog.innerHTML = "完成！";
                setTimeout(() => captchaPass(onSuccess), 280);
              } else {
                prog.innerHTML = `下一步：点击 <b>${expect}</b>`;
              }
            } else {
              err.textContent = "顺序错误，已重置";
              expect = 1;
              body.querySelectorAll(".seq-cell").forEach(c => c.classList.remove("done"));
              prog.innerHTML = `下一步：点击 <b>1</b>`;
              setTimeout(() => { err.textContent = ""; }, 800);
            }
          };
        });
      }

      /* ——— Auth UI ——— */
      function openAuth(mode) {
        state.authMode = mode;
        const overlay = document.getElementById("authOverlay");
        document.getElementById("authErr").classList.remove("show");
        document.getElementById("authUser").value = "";
        document.getElementById("authPass").value = "";
        document.getElementById("regNick").value = "";
        syncAuthMode();
        overlay.classList.add("show");
        setTimeout(() => document.getElementById(mode === "register" ? "regNick" : "authUser").focus(), 50);
      }

      function syncAuthMode() {
        const reg = state.authMode === "register";
        document.getElementById("authTitle").textContent = reg ? "注册微博" : "登录微博";
        document.getElementById("authSub").textContent = reg ? "创建账号，开启你的模拟微博之旅" : "使用账号密码登录模拟社区";
        document.getElementById("nickField").hidden = !reg;
        document.getElementById("authSubmit").textContent = reg ? "注册并登录" : "登录";
        document.getElementById("authSwitchText").textContent = reg ? "已有账号？" : "还没有账号？";
        document.getElementById("authSwitchLink").textContent = reg ? "去登录" : "立即注册";
      }

      /* ——— emoji ——— */
      function buildEmojiPop() {
        const pop = document.getElementById("emojiPop");
        pop.innerHTML = EMOJIS.map(e => `<button type="button" data-e="${e}">${e}</button>`).join("");
        pop.querySelectorAll("button").forEach(b => {
          b.onclick = () => {
            const ta = document.getElementById("postInput");
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const v = ta.value;
            ta.value = v.slice(0, start) + b.dataset.e + v.slice(end);
            ta.focus();
            const pos = start + b.dataset.e.length;
            ta.setSelectionRange(pos, pos);
            document.getElementById("charCount").textContent = ta.value.length;
            pop.classList.remove("open");
          };
        });
      }

      function readFiles(files, type) {
        [...files].forEach(file => {
          if (state.draftMedia.length >= 9) {
            toast("最多 9 个媒体文件");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            state.draftMedia.push({ type, url: reader.result, name: file.name });
            renderMediaPreview();
          };
          reader.readAsDataURL(file);
        });
      }

      /* ——— wire events ——— */
      function bind() {
        document.getElementById("guestLoginBtn").onclick = () => openAuth("login");
        document.getElementById("authClose").onclick = () => document.getElementById("authOverlay").classList.remove("show");
        document.getElementById("authSwitchLink").onclick = (e) => {
          e.preventDefault();
          state.authMode = state.authMode === "login" ? "register" : "login";
          syncAuthMode();
        };
        document.getElementById("authSubmit").onclick = () => {
          const user = document.getElementById("authUser").value.trim();
          const pass = document.getElementById("authPass").value;
          const nick = document.getElementById("regNick").value;
          const errEl = document.getElementById("authErr");
          let err = state.authMode === "register"
            ? register(user, pass, nick)
            : login(user, pass);
          if (err) {
            errEl.textContent = err;
            errEl.classList.add("show");
            return;
          }
          document.getElementById("authOverlay").classList.remove("show");
          renderAll();
          toast(state.authMode === "register" ? "注册成功" : "登录成功");
        };
        document.getElementById("authPass").onkeydown = (e) => {
          if (e.key === "Enter") document.getElementById("authSubmit").click();
        };

        document.getElementById("postInput").oninput = (e) => {
          document.getElementById("charCount").textContent = e.target.value.length;
        };
        document.getElementById("publishBtn").onclick = tryPublish;

        document.getElementById("emojiBtn").onclick = (e) => {
          e.stopPropagation();
          if (!requireAuth("使用表情")) return;
          document.getElementById("emojiPop").classList.toggle("open");
        };
        document.addEventListener("click", () => document.getElementById("emojiPop").classList.remove("open"));
        document.getElementById("emojiPop").onclick = (e) => e.stopPropagation();

        document.getElementById("imgBtn").onclick = () => {
          if (!requireAuth("上传图片")) return;
          document.getElementById("imgInput").click();
        };
        document.getElementById("vidBtn").onclick = () => {
          if (!requireAuth("上传视频")) return;
          document.getElementById("vidInput").click();
        };
        document.getElementById("imgInput").onchange = (e) => {
          readFiles(e.target.files, "image");
          e.target.value = "";
        };
        document.getElementById("vidInput").onchange = (e) => {
          readFiles(e.target.files, "video");
          e.target.value = "";
        };

        document.querySelectorAll("[data-view]").forEach(btn => {
          btn.addEventListener("click", () => {
            const map = { home: "all", fav: "fav", mine: "mine" };
            const v = map[btn.dataset.view] || "all";
            if ((v === "fav" || v === "mine") && !state.user) {
              openAuth("login");
              return;
            }
            state.view = v;
            renderFeed();
          });
        });
        document.querySelectorAll(".feed-tabs button").forEach(btn => {
          btn.addEventListener("click", () => {
            if ((btn.dataset.tab === "fav" || btn.dataset.tab === "mine") && !state.user) {
              openAuth("login");
              return;
            }
            state.view = btn.dataset.tab;
            renderFeed();
          });
        });

        document.getElementById("lightbox").onclick = () => {
          document.getElementById("lightbox").classList.remove("show");
        };

        // Dev helper: force a specific captcha via console
        window.__wbForceCaptcha = (type) => {
          if (!state.user) { openAuth("login"); return; }
          state.pendingPost = {
            id: "p" + Date.now(),
            userId: state.user.username,
            nick: state.user.nick,
            text: "（测试验证码）",
            media: [],
            likes: [],
            favs: [],
            comments: [],
            time: Date.now(),
          };
          openCaptcha(type || CAPTCHA_TYPES[Math.floor(Math.random() * CAPTCHA_TYPES.length)], finalizePublish);
        };
      }

      /* boot */
      state.user = currentUser();
      state.posts = initDemoPosts();
      buildEmojiPop();
      bind();
      renderAll();
    })();
  </script>
</body>
